name: Inject stable site fixes
on:
  push:
    branches: [main]
    paths:
      - 'assets/site-fixes.css'
      - 'assets/site-fixes.js'
      - '.site-fixes-trigger'
      - '.github/workflows/inject-site-fixes.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject fix assets into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="assets/site-fixes.css?v=20260806-2">'
          js = '<script src="assets/site-fixes.js?v=20260806-2" defer></script>'
          import re
          s = re.sub(r'<link rel="stylesheet" href="assets/site-fixes\.css[^>]*>', '', s)
          s = re.sub(r'<script src="assets/site-fixes\.js[^>]*></script>', '', s)
          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('index.html is missing closing head/body tags')
          s = s.replace('</head>', css + '\n</head>', 1)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injected links
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Inject stable galaxy and video controls"
          git push
