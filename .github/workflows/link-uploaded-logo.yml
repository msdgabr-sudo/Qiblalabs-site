name: Link uploaded Qibla Labs logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace broken logo sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          logo = 'images/logo.png?v=2'

          s, n1 = re.subn(r'(<img\b[^>]*class=["\'][^"\']*\bsplash-logo\b[^"\']*["\'][^>]*\bsrc=["\'])[^"\']*(["\'])', r'\1' + logo + r'\2', s, count=1, flags=re.I)
          if n1 == 0:
              s, n1 = re.subn(r'(<img\b[^>]*\bsrc=["\'])[^"\']*(["\'][^>]*class=["\'][^"\']*\bsplash-logo\b)', r'\1' + logo + r'\2', s, count=1, flags=re.I)

          s, n2 = re.subn(r'(<img\b[^>]*class=["\'][^"\']*\bfinal-logo\b[^"\']*["\'][^>]*\bsrc=["\'])[^"\']*(["\'])', r'\1' + logo + r'\2', s, count=1, flags=re.I)
          if n2 == 0:
              s, n2 = re.subn(r'(<img\b[^>]*\bsrc=["\'])[^"\']*(["\'][^>]*class=["\'][^"\']*\bfinal-logo\b)', r'\1' + logo + r'\2', s, count=1, flags=re.I)

          # Header logo, when represented by an image.
          s = re.sub(r'(<img\b[^>]*class=["\'][^"\']*\bmini-logo\b[^"\']*["\'][^>]*\bsrc=["\'])[^"\']*(["\'])', r'\1' + logo + r'\2', s, count=1, flags=re.I)

          # Add safe image behavior and avoid showing broken alt text.
          if '.splash-logo,.final-logo{object-fit:contain}' not in s:
              s = s.replace('</style>', '.splash-logo,.final-logo{object-fit:contain;display:block;color:transparent}\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          print(f'splash replacements={n1}, final replacements={n2}')
          PY
      - name: Commit and push
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link uploaded Qibla Labs logo"
          git pull --rebase origin main
          git push origin HEAD:main
