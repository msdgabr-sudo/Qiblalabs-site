name: Add faith feature sections

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sections below Quran
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'id="faith-features"'
          if marker in html:
              print('Faith sections already present; nothing to do.')
              raise SystemExit(0)

          css = r'''
/* QiblaAstro faith features */
.faith-features{position:relative;overflow:hidden;background:linear-gradient(180deg,#06110b 0,#071426 18%,#02050b 100%)}
.faith-features:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,#d8ad4218,transparent 28%),radial-gradient(circle at 82% 32%,#62ddff13,transparent 30%)}
.faith-intro{position:relative;text-align:center;max-width:850px;margin:0 auto 40px}.faith-intro h2{font-size:clamp(2.25rem,5vw,4.7rem);line-height:1.08;margin:.15em 0}.faith-intro p{color:var(--muted);font-size:1.08rem}
.prayer-dashboard{position:relative;padding:34px;border-radius:38px;overflow:hidden;background:linear-gradient(145deg,#0b1f37e8,#06111fee);border:1px solid #ffffff1f;box-shadow:0 34px 100px #000b,0 0 52px #d8ad4214}
.prayer-dashboard:before{content:"";position:absolute;inset:-55%;background:conic-gradient(from 180deg,transparent,#d8ad4212,transparent 25%,#62ddff12,transparent 55%);animation:faithSpin 22s linear infinite}
.prayer-top,.prayer-row{position:relative;z-index:1}.prayer-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.next-prayer{display:flex;align-items:center;gap:17px}.crescent{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 65% 35%,#fff5bd,#d8ad42 43%,#7d4d0f 75%);box-shadow:0 0 38px #d8ad4277;position:relative}.crescent:after{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:#091a2d;top:-3px;left:4px}.next-prayer strong{display:block;font-size:clamp(1.45rem,3vw,2.25rem);color:var(--gold2)}.next-prayer span{color:var(--muted)}.prayer-clock{font:900 clamp(2.3rem,6vw,5rem)/1 "JetBrains Mono",monospace;color:#fff;text-shadow:0 0 28px #62ddff55;direction:ltr}
.prayer-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.prayer-time{padding:18px 8px;text-align:center;border-radius:22px;background:#ffffff08;border:1px solid #ffffff10;transition:.35s transform,.35s border-color,.35s background}.prayer-time:hover{transform:translateY(-5px);border-color:#d8ad4270}.prayer-time.active{background:linear-gradient(145deg,#d8ad4228,#f6df8f10);border-color:#f6df8f80;box-shadow:0 0 30px #d8ad4228}.prayer-time b{display:block;color:#fff;font-size:1.02rem}.prayer-time span{display:block;color:var(--gold2);direction:ltr;font-weight:900}.prayer-time small{color:#8392a8}
.adhan-stage{margin-top:24px;display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:stretch}.adhan-copy,.adhan-visual{border-radius:34px;padding:32px;position:relative;overflow:hidden}.adhan-copy{background:linear-gradient(145deg,#111f35,#07101c);border:1px solid #ffffff1b}.adhan-copy h3{font-size:clamp(2rem,4vw,3.6rem);margin:0;color:var(--gold2)}.adhan-copy p{color:var(--muted);font-size:1.06rem}.adhan-line{color:#fff;font-size:clamp(1.25rem,3vw,2rem);font-weight:900;margin-top:22px}.adhan-visual{min-height:310px;display:grid;place-items:center;background:radial-gradient(circle at 50% 100%,#e69f3a66,transparent 36%),linear-gradient(180deg,#10294b,#6a351b 65%,#130c0b)}.mosque{position:absolute;left:8%;right:8%;bottom:0;height:45%;background:#02050be8;clip-path:polygon(0 100%,0 65%,8% 65%,8% 48%,14% 48%,14% 62%,22% 62%,22% 38%,26% 38%,26% 62%,37% 62%,37% 25%,42% 25%,42% 62%,58% 62%,58% 25%,63% 25%,63% 62%,74% 62%,74% 38%,78% 38%,78% 62%,86% 62%,86% 48%,92% 48%,92% 65%,100% 65%,100% 100%)}.adhan-waves{position:relative;z-index:2;width:190px;height:190px;display:grid;place-items:center}.adhan-waves i{position:absolute;border:2px solid #f6df8f;border-radius:50%;animation:adhanPulse 3s ease-out infinite}.adhan-waves i:nth-child(1){width:54px;height:54px}.adhan-waves i:nth-child(2){width:104px;height:104px;animation-delay:.55s}.adhan-waves i:nth-child(3){width:160px;height:160px;animation-delay:1.1s}.adhan-core{font-size:3.4rem;filter:drop-shadow(0 0 20px #f6df8f)}
.dhikr-showcase{margin-top:24px}.dhikr-showcase .head{text-align:center;margin:0 auto 28px}.dhikr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.dhikr-card{min-height:260px;border-radius:30px;padding:25px;position:relative;overflow:hidden;border:1px solid #ffffff1b;box-shadow:0 24px 60px #0007;transition:.4s transform,.4s box-shadow}.dhikr-card:hover{transform:translateY(-8px) rotateX(2deg);box-shadow:0 34px 80px #000a}.dhikr-card:before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;top:-80px;left:-60px;background:#ffffff17;filter:blur(2px)}.dhikr-card .dhikr-icon{font-size:3rem;display:block;margin-bottom:28px}.dhikr-card h3{font-size:1.45rem;margin:0 0 8px}.dhikr-card p{color:#ffffffc2;margin:0}.morning{background:linear-gradient(145deg,#247cb9,#5ac8fa 56%,#d9f1ff)}.evening{background:linear-gradient(145deg,#562a55,#b55e62 52%,#f0a878)}.after-prayer{background:linear-gradient(145deg,#114f43,#258a72 58%,#7fd8bd)}.sleep{background:linear-gradient(145deg,#161d49,#32387a 60%,#777ed1)}
.faith-finale{text-align:center;padding:86px 0 10px;position:relative}.final-orbit{width:min(430px,78vw);aspect-ratio:1;margin:auto;position:relative;display:grid;place-items:center}.final-orbit:before,.final-orbit:after{content:"";position:absolute;inset:8%;border:1px solid #d8ad426e;border-radius:50%;animation:faithSpin 18s linear infinite}.final-orbit:after{inset:18%;border-color:#62ddff55;animation-direction:reverse;animation-duration:13s}.final-logo{width:67%;filter:drop-shadow(0 0 36px #d8ad4288);animation:faithFloat 5s ease-in-out infinite}.faith-finale h3{font-size:clamp(2rem,5vw,4.3rem);margin:12px 0 6px}.faith-finale p{max-width:760px;margin:auto;color:var(--muted);font-size:1.08rem}
@keyframes faithSpin{to{transform:rotate(360deg)}}@keyframes faithFloat{50%{transform:translateY(-12px) scale(1.025)}}@keyframes adhanPulse{0%{transform:scale(.62);opacity:0}30%{opacity:.9}100%{transform:scale(1.24);opacity:0}}
@media(max-width:900px){.prayer-row{grid-template-columns:repeat(3,1fr)}.adhan-stage{grid-template-columns:1fr}.dhikr-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.prayer-dashboard{padding:22px 14px}.prayer-top{display:block;text-align:center}.next-prayer{justify-content:center}.prayer-clock{margin-top:18px}.prayer-row{grid-template-columns:repeat(2,1fr)}.dhikr-grid{grid-template-columns:1fr}.adhan-copy,.adhan-visual{padding:24px}.faith-finale{padding-top:64px}}
'''

          section = r'''
<section class="faith-features" id="faith-features">
  <div class="wrap">
    <div class="faith-intro">
      <span class="eyebrow">A COMPLETE ISLAMIC EXPERIENCE</span>
      <h2>يومك الإيماني… في تجربة واحدة.</h2>
      <p>من مواقيت الصلاة والتنبيه بالأذان، إلى الأذكار اليومية الهادئة؛ صُمِّمت كل ميزة لترافقك بوضوح وجمال دون أن تشتتك.</p>
    </div>

    <div class="prayer-dashboard">
      <div class="prayer-top">
        <div class="next-prayer"><div class="crescent"></div><div><span>الصلاة القادمة</span><strong>صلاة الفجر</strong><span>تنبيه دقيق وفق موقعك وإعدادات الحساب</span></div></div>
        <div class="prayer-clock">04:38</div>
      </div>
      <div class="prayer-row">
        <div class="prayer-time active"><b>الفجر</b><span>04:38</span><small>Fajr</small></div>
        <div class="prayer-time"><b>الشروق</b><span>06:09</span><small>Sunrise</small></div>
        <div class="prayer-time"><b>الظهر</b><span>12:01</span><small>Dhuhr</small></div>
        <div class="prayer-time"><b>العصر</b><span>15:24</span><small>Asr</small></div>
        <div class="prayer-time"><b>المغرب</b><span>17:54</span><small>Maghrib</small></div>
        <div class="prayer-time"><b>العشاء</b><span>19:15</span><small>Isha</small></div>
      </div>
    </div>

    <div class="adhan-stage">
      <article class="adhan-copy">
        <span class="eyebrow">PRAYER CALL</span>
        <h3>الأذان… في وقته.</h3>
        <p>تنبيه واضح عند دخول وقت الصلاة، مع تجربة صوتية هادئة وإعدادات تمنح المستخدم التحكم الكامل.</p>
        <div class="adhan-line">عندما يحين الوقت، يذكّرك QiblaAstro بالصلاة.</div>
      </article>
      <div class="adhan-visual" aria-label="تصوير بصري لموجات الأذان"><div class="adhan-waves"><i></i><i></i><i></i><div class="adhan-core">🕌</div></div><div class="mosque"></div></div>
    </div>

    <div class="dhikr-showcase">
      <div class="head"><span class="eyebrow">DAILY ADHKAR</span><h2>أذكار ترافق أوقات يومك.</h2><p>تصميم مريح للقراءة، عدّاد واضح، واستكمال تلقائي من آخر ذكر لم يكتمل.</p></div>
      <div class="dhikr-grid">
        <article class="dhikr-card morning"><span class="dhikr-icon">☀️</span><h3>أذكار الصباح</h3><p>بداية مطمئنة ليومك مع عرض واضح وعدّاد بسيط.</p></article>
        <article class="dhikr-card evening"><span class="dhikr-icon">🌙</span><h3>أذكار المساء</h3><p>ختام هادئ لليوم بألوان دافئة وتجربة مريحة.</p></article>
        <article class="dhikr-card after-prayer"><span class="dhikr-icon">🤲</span><h3>بعد الصلاة</h3><p>الأذكار المأثورة مرتبة لتصل إليها في وقتها بسهولة.</p></article>
        <article class="dhikr-card sleep"><span class="dhikr-icon">✨</span><h3>قبل النوم</h3><p>تجربة ليلية هادئة تساعدك على إتمام أذكار النوم.</p></article>
      </div>
    </div>

    <div class="faith-finale">
      <div class="final-orbit"><svg class="final-logo" viewBox="0 0 1000 1000"><use href="#qibla-logo"/></svg></div>
      <h3>QiblaAstro Ultimate</h3>
      <p>القبلة الفلكية الدقيقة، القرآن الكريم، مواقيت الصلاة، الأذان والأذكار اليومية — منظومة إسلامية متكاملة بهوية Qibla Labs.</p>
    </div>
  </div>
</section>
'''

          html = html.replace('</style>', css + '\n</style>', 1)
          quran_start = html.find('<section class="quran">')
          if quran_start == -1:
              raise SystemExit('Quran section not found')
          quran_end = html.find('</section>', quran_start)
          if quran_end == -1:
              raise SystemExit('Quran section closing tag not found')
          quran_end += len('</section>')
          html = html[:quran_end] + '\n' + section + html[quran_end:]
          path.write_text(html, encoding='utf-8')
          print('Faith sections inserted successfully.')
          PY
      - name: Commit updated page
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Showcase prayer times, adhan and daily adhkar"
          git push
