name: Add video controls
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/video-controls-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add native playback controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<video class="video-main" id="heroVideo" muted loop playsinline autoplay preload="metadata">'
          new = '<video class="video-main" id="heroVideo" muted loop playsinline autoplay controls controlsList="nodownload noplaybackrate" preload="metadata">'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'id="heroVideo"' in s and ' controls ' not in s:
              s = s.replace('id="heroVideo"', 'id="heroVideo" controls controlsList="nodownload noplaybackrate"', 1)
          else:
              print('Video already has controls or target was not found.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add playback controls to promo video"
          git push
