name: Bump media assets v3
on:
  push:
    paths:
      - '.github/workflows/bump-media-assets-v3.yml'
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/site-fixes.css?v=20260806-2', 'assets/site-fixes.css?v=20260806-3')
          s = s.replace('assets/site-fixes.js?v=20260806-2', 'assets/site-fixes.js?v=20260806-3')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh video controls and subtitle assets"
          git push
