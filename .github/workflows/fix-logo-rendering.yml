name: Fix logo rendering

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix logo SVG references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<use href="#qibla-logo"/>','<use href="#qibla-logo" xlink:href="#qibla-logo"/>')
          s=s.replace('<use href="#qibla-logo"></use>','<use href="#qibla-logo" xlink:href="#qibla-logo"></use>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Qibla Labs logo rendering"
          git push
